<script>
// ===== Supabase layer (same API the page used before) =====
(function(){
const SB_URL='https://abhciubprkkextodwmxw.supabase.co';
const SB_KEY='sb_publishable_3Tf9kII0zxOth2uQj_3w9w_952xNgSV';
const sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const OF=window.OF={sb,who:null,session:null,pins:{}};
const clean=d=>JSON.parse(JSON.stringify(d==null?{}:d));
const norm=e=>({code:(e&&(e.code==='42501'||/row-level|permission|locked/i.test(e.message||'')))?'invalid_argument':'unavailable',message:(e&&e.message)||''});
const split=p=>{const a=p.split('/');return{coll:a.slice(0,-1).join('/'),id:a[a.length-1]}};
const rid=()=>{const a='abcdefghijklmnopqrstuvwxyz0123456789';let s='';const b=new Uint32Array(20);crypto.getRandomValues(b);for(const x of b)s+=a[x%a.length];return s};
const snap=(id,row)=>({id,exists:!!row,data:()=>row?row.data:undefined,metadata:{fromCache:false,hasPendingWrites:false}});
const polls=new Set();
function poll(fetcher,next,err){let last=null,dead=false;const run=async()=>{if(dead)return;try{const s=await fetcher();const k=s.__key;if(k!==last){last=k;next(s)}}catch(e){}};const p={run,stop(){dead=true;polls.delete(p)}};polls.add(p);run();return()=>p.stop()}
const bump=()=>setTimeout(()=>polls.forEach(p=>p.run()),150);
setInterval(()=>{if(document.visibilityState==='visible')polls.forEach(p=>p.run())},6000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')bump()});
OF.refresh=bump;
function docRef(path){const {coll,id}=split(path);const ref={id,path,
  async get(){const {data,error}=await sb.from('of_docs').select('data').eq('path',path).maybeSingle();if(error)throw norm(error);const s=snap(id,data);s.__key=JSON.stringify(data);return s},
  async set(d){const {error}=await sb.from('of_docs').upsert({path,coll,id,data:clean(d)});if(error)throw norm(error);bump()},
  async update(d){const {error}=await sb.rpc('of_merge',{p_path:path,p_patch:clean(d)});if(error)throw norm(error);bump()},
  async delete(){const {error}=await sb.from('of_docs').delete().eq('path',path);if(error)throw norm(error);bump()},
  onSnapshot(next,err){return poll(()=>ref.get(),next,err)},
  collection(sub){return collRef(path+'/'+sub)}};return ref}
function query(coll,filters,order,lim){const q={
  where(f,op,v){return query(coll,filters.concat([[f,op,v]]),order,lim)},
  orderBy(f,dir){return query(coll,filters,[f,dir||'asc'],lim)},
  limit(n){return query(coll,filters,order,n)},
  async get(){let rows=[];for(let from=0;;from+=1000){let r=sb.from('of_docs').select('id,data').eq('coll',coll);for(const [f,op,v] of filters){if(op==='==')r=r.eq('data->>'+f,String(v))}const {data,error}=await r.order('id').range(from,from+999);if(error)throw norm(error);rows=rows.concat(data||[]);if(!data||data.length<1000)break}
    for(const [f,op,v] of filters){if(op!=='==')rows=rows.filter(x=>{const a=x.data[f];return op==='!='?a!=v:op==='<'?a<v:op==='<='?a<=v:op==='>'?a>v:op==='>='?a>=v:op==='in'?v.includes(a):op==='not-in'?!v.includes(a):op==='array-contains'?(a||[]).includes(v):true})}
    if(order){const [f,dir]=order;rows.sort((a,b)=>{const x=a.data[f],y=b.data[f];return (x>y?1:x<y?-1:0)*(dir==='desc'?-1:1)})}
    if(lim)rows=rows.slice(0,lim);
    const docs=rows.map(r=>snap(r.id,r));return {docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:{fromCache:false},__key:JSON.stringify(rows)}},
  onSnapshot(next,err){return poll(()=>q.get(),next,err)}};return q}
function collRef(coll){const q=query(coll,[],null,null);q.path=coll;q.doc=id=>docRef(coll+'/'+(id||rid()));q.add=async d=>{const r=q.doc();await r.set(d);return r};return q}
const DB={doc:docRef,collection:collRef};
const USER={isOwner:async()=>!!(OF.who&&OF.who.owner),id:async()=>OF.who?OF.who.uid:null,me:async()=>({name:OF.who&&OF.who.staff&&OF.who.staff.name||(OF.who&&OF.who.email)||''}),profiles:async()=>({}),canEdit:async()=>!!(OF.who&&OF.who.owner)};
const DL={save({filename,data}){const blob=data instanceof Blob?data:new Blob([data]);const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);return Promise.resolve({status:'saved'})}};
window.claude={use:async n=>({db:DB,user:USER,downloads:DL})[n]||null};
OF.loadPins=async()=>{try{const {data}=await sb.rpc('of_get_pins');OF.pins=data||{}}catch(e){}};
OF.init=async()=>{const {data:{session}}=await sb.auth.getSession();OF.session=session;if(session){let {data}=await sb.rpc('of_whoami');if(data&&!data.owner&&!data.staff){try{const c=await sb.rpc('of_claim_staff');if(c.data){data=(await sb.rpc('of_whoami')).data}}catch(e){}}OF.who=data;if(data&&(data.owner||(data.staff&&data.staff.perms&&['pins.view','campaigns.send','tickets.approve','campaigns','approveTickets'].some(k=>data.staff.perms[k]))))await OF.loadPins()}};
sb.auth.onAuthStateChange((ev)=>{if(ev==='PASSWORD_RECOVERY')OF.recovery=true});
})();
</script>

async function boot(){

  if(user){try{isOwner=(await user.isOwner())??false}catch(e){}try{me=await user.id()}catch(e){}}
  if(db){try{const sd=await db.doc('settings/main').get();if(sd.exists)S.settings=sd.data()}catch(e){}
    try{const ss=await db.collection('staff').get();S.staff=ss.docs.map(d=>({id:d.id,...d.data()}))}catch(e){}
    if(me&&!isOwner){await new Promise(res=>{let first=true;const fin=()=>{if(first){first=false;res()}};db.doc('staff/'+me).onSnapshot(s=>{const was=JSON.stringify(staffMe);staffMe=s.exists?s.data():null;if(first)fin();else if(was!==JSON.stringify(staffMe))route()},fin);setTimeout(fin,8000)})}}
  window.addEventListener('hashchange',route);
  route();
}

function route(){
  const h=location.hash.replace('#','');
  $$('.modal-bg').forEach(m=>m.remove());
  document.body.classList.toggle('lp-body',h===''||h==='home');
  if(h.startsWith('reg-'))return renderRegister(h.slice(4));
  if(OF.recovery)return renderSetPassword();
  if(/access_token|error_description|type=/.test(h)){history.replaceState(null,'',location.pathname+(OF.session?'#login':'#'));return route()}
  if(h===''||h==='home')return renderLanding();
  if(!OF.session)return renderLogin();
  const isStaffUser=isOwner||!!(staffMe&&staffMe.active!==false);
  const home=()=>isStaffUser?((isOwner||(isPanelUser()&&!can('deliver.view')))?'admin':'staff'):'account';
  if(h==='login'){location.hash=home();return}
  if(!isStaffUser)return (h==='staff'||h==='join')?renderJoin():renderAccount();
  if(!isOwner&&staffMe&&staffMe.mustChangePw)return renderSetPassword(true);
  if(h==='account'){location.hash=home();return}
  const wantsPanel=(h==='admin'||(h==='staff'&&!isOwner&&!can('deliver.view')))&&isPanelUser();
  const isStaffRoute=!wantsPanel;
  if(isStaffRoute&&lastRoute!=='staff'){if(staffUnsub){staffUnsub();staffUnsub=null}staffCurrent=null;lastStaff=null;sel=new Set()}
  lastRoute=isStaffRoute?'staff':h;
  if(!ssGet('bs_br_ok'))return renderBranchPick();
  if(h.startsWith('card-'))return renderPublicCard(h.slice(5));
  if(wantsPanel)return renderAdmin();
  return renderStaff();
}

function startSubs(){
  if(subsStarted)return;subsStarted=true;
  const timer=setTimeout(()=>{if(!(S.loaded.a&&S.loaded.o&&S.loaded.c)){toast('البيانات تتأخر… تحقق من الاتصال')}},10000);
  const done=()=>{if(S.loaded.a&&S.loaded.o&&S.loaded.c)clearTimeout(timer)};
  const err=e=>{toast('خطأ في البيانات: '+(e&&e.code||''))};
  db.collection('agreements').onSnapshot(s=>{S.agreements=s.docs.map(d=>({id:d.id,...d.data()}));S.loaded.a=true;done();rerender()},err);
  db.collection('orgs').onSnapshot(s=>{S.orgs=s.docs.map(d=>({id:d.id,...d.data()}));S.loaded.o=true;done();rerender()},err);
  const pinFilled=new Set();
  db.collection('customers').onSnapshot(async s=>{S.customers=s.docs.map(d=>({id:d.id,...d.data()}));S.loaded.c=true;done();rerender();
    if(isOwner){for(const c of S.customers){if(!(OF.pins&&OF.pins[c.id])&&!pinFilled.has(c.id)){pinFilled.add(c.id);try{const r=await OF.sb.rpc('of_new_pin',{p_code:c.id});if(r.data)OF.pins[c.id]=r.data}catch(e){}}}}},err);
  db.collection('staff').onSnapshot(s=>{S.staff=s.docs.map(d=>({id:d.id,...d.data()}));rerender()},err);
  if(can('staff.view'))db.collection('staffRequests').onSnapshot(s=>{S.staffReqs=s.docs.map(d=>({id:d.id,...d.data()}));const n=S.staffReqs.filter(r=>r.status==='pending').length;const b=$('[data-tab="settings"]');if(b)b.textContent='الإعدادات'+(n?' ('+n+')':'');rerender()},err);
  db.collection('tickets').onSnapshot(s=>{S.tickets=s.docs.map(d=>({id:d.id,...d.data()}));const n=S.tickets.filter(t=>t.status==='open').length;const b=$('[data-tab="tickets"]');if(b)b.textContent='الطلبات'+(n?' ('+n+')':'');rerender()},err);
  if(can('requests.view'))db.collection('serviceRequests').onSnapshot(s=>{S.requests=s.docs.map(d=>({id:d.id,...d.data()}));const n=S.requests.filter(r=>(r.status||'new')==='new').length;const b=$('[data-tab="requests"]');if(b)b.textContent='طلبات الخدمة'+(n?' ('+n+')':'');rerender()},err);
  db.collection('deliveries').onSnapshot(s=>{S.deliveries=s.docs.map(d=>({id:d.id,...d.data()}));rerender()},err);
  db.doc('settings/main').onSnapshot(s=>{S.settings=s.exists?s.data():{};S.loaded.s=true;rerender()},err);
}

const STATUS_OPTS=[['','كل الحالات'],['pending','لم يستلم'],['partial','استلم جزئياً'],['done','استلم'],['nopurchase','استلم بدون شراء إضافي'],['expiring','تنتهي صلاحيته خلال 7 أيام'],['expired','انتهت صلاحيته ولم يستلم'],['nowa','لم يُرسل له واتساب']];
function custAmount(c){return Object.values(c.redemptions||{}).reduce((s,r)=>s+(+r.amount||0),0)}
function matchStatus(c,st){const s=custStatus(c);const a=agreementOf(c);const end=custEnd(c,a);const days=end?(new Date(end+'T23:59:59')-Date.now())/864e5:Infinity;
  switch(st){case'':return true;case'nowa':return !c.waSentAt;case'nopurchase':return s.r>0&&custAmount(c)===0;case'expiring':return s.r<s.g&&days>=0&&days<=7;case'expired':return s.r<s.g&&days<0;default:return s.k===st}}
function filterCustomers(f){
  const q=toLatin(f.q||'').trim().toLowerCase();
  return S.customers.filter(c=>{const o=byId(S.orgs,c.orgId)||{};
    if(f.org&&c.orgId!==f.org)return false;
    if(f.sector&&o.sector!==f.sector)return false;
    if(f.ag&&c.agreementId!==f.ag)return false;
    if(f.branch&&(f.branch==='-'?!!c.branch:c.branch!==f.branch))return false;
    if(f.from&&dayKey(c.createdAt)<f.from)return false;
    if(f.to&&dayKey(c.createdAt)>f.to)return false;
    if(!matchStatus(c,f.st||''))return false;
    if(q){const hay=((c.name||'')+' '+c.phone+' '+localPhone(c.phone)+' '+c.id+' '+(c.orgLabel||'')).toLowerCase();if(!hay.includes(q))return false}

}

function importDialog(){
  modal('<h2>'+ic('upload')+'استيراد عملاء من Excel</h2><p class="muted small">الملف يكون فيه عمود <b>الاسم</b> وعمود <b>الجوال</b>، واختياري عمود <b>الجهة</b>. كل عميل يطلع له كود ورمز تسليم حسب اتفاقية الجهة اللي تختارها.</p>'+
  '<label class="f"><span>الجهة اللي يُضافون لها</span><select id="impOrg">'+S.orgs.map(o=>'<option value="'+o.id+'">'+esc(o.name)+'</option>').join('')+'</select></label>'+
  '<div class="row" style="margin-bottom:10px"><input type="file" id="impFile" accept=".xlsx,.xls,.csv"><button class="btn sec sm" id="impTpl">تنزيل قالب فاضي</button></div><div id="impPrev"></div>',(m,close)=>{
    $('#impTpl',m).onclick=()=>saveFile('قالب-استيراد-العملاء.xlsx',xlsxBlob([['العملاء',[['الاسم','الجوال','الجهة'],['محمد أحمد','0551234567','']]]]));
    let rows=[];
    $('#impFile',m).onchange=async e=>{const fl=e.target.files&&e.target.files[0];if(!fl)return;if(typeof XLSX==='undefined'){toast('مكتبة Excel ما تحمّلت');return}
      try{const wb=XLSX.read(await fl.arrayBuffer(),{type:'array'});const data=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
        const h=(data[0]||[]).map(x=>String(x).trim().toLowerCase());const fi=keys=>h.findIndex(x=>keys.some(k=>x.includes(k)));
        let iN=fi(['اسم','name']),iP=fi(['جوال','هاتف','رقم','phone','mobile']),iO=fi(['جهة','مدرسة','شركة','org']);const start=(iN>=0||iP>=0)?1:0;if(iN<0)iN=0;if(iP<0)iP=1;
        const existing=new Set(S.customers.map(c=>c.phone));const seen=new Set();
        rows=data.slice(start).map(r=>({name:String(r[iN]||'').trim(),raw:String(r[iP]||'').trim(),phone:normPhone(r[iP]),org:iO>=0?String(r[iO]||'').trim():''})).filter(r=>r.name||r.raw);
        rows.forEach(r=>{r.err=!r.phone?'رقم غير صحيح':!r.name?'بدون اسم':existing.has(r.phone)?'مسجّل من قبل':seen.has(r.phone)?'مكرر في الملف':'';if(r.phone)seen.add(r.phone)});
        const good=rows.filter(r=>!r.err);
        $('#impPrev',m).innerHTML='<div class="note" style="margin-bottom:8px">'+rows.length+' صف · <b>'+good.length+' جاهز للإضافة</b> · '+(rows.length-good.length)+' مرفوض</div><div class="scroll" style="max-height:220px;overflow:auto"><table class="tbl"><tbody>'+rows.slice(0,100).map(r=>'<tr><td>'+esc(r.name)+'</td><td class="ltr">'+esc(r.raw)+'</td><td>'+(r.err?'<span class="pill p-bad">'+r.err+'</span>':'<span class="pill p-ok">'+ic('check')+'</span>')+'</td></tr>').join('')+'</tbody></table></div>'+(good.length?'<button class="btn ok big" style="margin-top:10px" id="impGo">إضافة '+good.length+' عميل</button>':'');
        if(good.length)$('#impGo',m).onclick=async()=>{const org=byId(S.orgs,$('#impOrg',m).value);const ag=org&&byId(S.agreements,org.agreementId);if(!org||!ag){toast('الجهة ما لها اتفاقية');return}
          const b=$('#impGo',m);b.disabled=true;let n=0,fail=0,full=0;const used=new Set(S.customers.map(c=>c.id));const icnt=orgCounts(org.id);
          for(const r of good){let code;do{code=rid(6,ALPH)}while(used.has(code));used.add(code);
            const pk=pickBranch(org,icnt,null);if(pk.full){full++;continue}const ibr=pk.branch||(pk.need?(pk.open||[])[0]:'')||'';if(ibr)icnt[ibr]=(icnt[ibr]||0)+1;
            const body={branch:ibr,branchStrict:!!ibr&&(org.dist||{}).strict!==false,name:r.name,phone:r.phone,orgLabel:r.org||org.name,orgId:org.id,agreementId:ag.id,code,gifts:(ag.gifts||[]).map(g=>({id:g.id,name:g.name})),giftsAllowed:+ag.giftsAllowed||1,redemptions:{},createdAt:nowISO(),consent:false,source:'import',pinFails:0};
            if(+ag.validDays>0){let e2=addDays(body.createdAt,+ag.validDays);if(ag.endsAt&&ag.endsAt<e2)e2=ag.endsAt;body.expiresAt=e2}
            try{await db.doc('customers/'+code).set(body);try{const r=await OF.sb.rpc('of_new_pin',{p_code:code});if(r.data)OF.pins[code]=r.data}catch(x){}n++}catch(x){fail++;if(x&&x.code==='quota_exceeded')break}
            b.textContent='جاري الإضافة… '+n+'/'+good.length}
          close();toast('تمت إضافة '+n+' عميل'+(fail?' · فشل '+fail:'')+(full?' · '+full+' ما انضافوا لأن الفروع اكتملت':''))};
      }catch(x){$('#impPrev',m).innerHTML='<div class="err">ما قدرت أقرأ الملف</div>'}};
  });
}

let campDraft=null;
const CAMP_DEFAULT='مرحباً {الاسم}،\nهديتك من بصمة الاهتمام للاتصالات ({الجهة}) ما زالت بانتظارك.\n{الهدايا}\nكودك: {الكود}\nصالحة حتى {الانتهاء} – مرّنا في أقرب فرع.';
function fillCamp(t,c){const a=agreementOf(c)||{};if(c.branch&&t.indexOf('{الفرع}')<0&&t.indexOf('{رابط_الفرع}')<0)t+='\n\n'+brLine(c);t=addSvc(t);t=t.split('{الفرع}').join(c.branch||'أقرب فرع').split('{رابط_الفرع}').join(c.branch?(branchInfo(c.branch).map||''):'');return t.split('{الاسم}').join(c.name||'').split('{الكود}').join(c.id).split('{الجهة}').join(c.orgLabel||'').split('{الهدايا}').join(giftsText(c)).split('{الانتهاء}').join(fmtD(custEnd(c,a))).split('{رمز_التسليم}').join((OF.pins&&OF.pins[c.id])||c.pin||'')}
function aCampaigns(el){
  if(!campDraft)campDraft={filter:{st:'pending'}};
  const d=campDraft;d.msg=d.msg||CAMP_DEFAULT;d.name=d.name||'';

  '<div class="row" style="margin-bottom:10px">'+presets.map(p=>'<button class="btn '+(d.filter.st===p[0]?'':'sec')+' sm" data-pre="'+p[0]+'">'+p[1]+'</button>').join('')+'</div>'+filterBar(d.filter)+
  '<label class="f" style="margin-top:12px"><span>اسم الحملة</span><input type="text" id="cName" value="'+esc(d.name)+'" placeholder="مثال: تذكير طلاب الشلفاء – ديسمبر"></label>'+
  '<label class="f"><span>نص الرسالة</span><textarea id="cMsg" style="min-height:150px">'+esc(d.msg)+'</textarea></label><p class="small muted" style="margin-top:-4px">المتغيرات: {الاسم} {الكود} {الجهة} {الهدايا} {الانتهاء} {رمز_التسليم} {الفرع} {رابط_الفرع} {رابط_خدماتنا}</p>'+
  '<div id="cSum"></div></div><div><div class="card"><h3>معاينة الرسالة</h3><div id="cPrev" class="note" style="white-space:pre-wrap"></div></div><div class="card"><h3>الحملات السابقة</h3><div id="cHist"></div></div></div></div>';
  const list=()=>filterCustomers(d.filter);
  const upd=()=>{const L=list();d.msg=$('#cMsg',el).value;d.name=$('#cName',el).value;
    $('#cSum',el).innerHTML='<div class="note" style="margin-bottom:10px">الشريحة: <b>'+L.length+' عميل</b></div>'+(can('campaigns.send')?'':'<div class="small muted">عرض فقط – ما عندك صلاحية إرسال الحملات.</div>')+'<div class="row'+(can('campaigns.send')?'':' hide')+'"><button class="btn" id="cXls" '+(L.length?'':'disabled')+'>'+ic('download')+'ملف الكول سنتر (Excel)</button><button class="btn wa" id="cQ" '+(L.length?'':'disabled')+'>إرسال متتابع</button></div><p class="small muted">الملف فيه: الجوال بصيغة 9665…، الاسم، والرسالة جاهزة لكل عميل – ارفعه في حملة جماعية على منصة هاتف من رقم 0577894369.</p>';
    $('#cPrev',el).textContent=L[0]?fillCamp(d.msg,L[0]):fillCamp(d.msg,{name:'محمد',id:'ABC123',orgLabel:'مدرسة النور',gifts:[{name:'هدية'}],giftsAllowed:1});
    $('#cXls',el).onclick=()=>runCampaign('file',L);$('#cQ',el).onclick=()=>runCampaign('queue',L)};
  bindFilterBar(el,d.filter,()=>{$$('[data-pre]',el).forEach(b=>b.className='btn '+(d.filter.st===b.dataset.pre?'':'sec')+' sm');upd()});
  $$('[data-pre]',el).forEach(b=>b.onclick=()=>{d.filter.st=b.dataset.pre;const s=$('[data-f="st"]',el);if(s)s.value=b.dataset.pre;$$('[data-pre]',el).forEach(x=>x.className='btn '+(x===b?'':'sec')+' sm');upd()});
  $('#cMsg',el).oninput=upd;$('#cName',el).oninput=()=>{d.name=$('#cName',el).value};
  upd();drawCampHist(el);

async function drawCampHist(el){const h=$('#cHist',el);if(!h)return;try{const s=await db.collection('campaigns').orderBy('createdAt','desc').limit(20).get();const L=s.docs.map(x=>({id:x.id,...x.data()}));
  h.innerHTML=L.length?L.map(c=>{const back=(c.ids||[]).map(id=>byId(S.customers,id)).filter(Boolean);const visited=back.filter(x=>Object.values(x.redemptions||{}).some(r=>r.at>c.createdAt)).length;return '<div style="padding:8px 0;border-top:1px solid var(--line)"><b>'+esc(c.name||'حملة')+'</b><div class="small muted">'+fmtDT(c.createdAt)+' · '+c.count+' عميل · '+(c.mode==='file'?'ملف كول سنتر':'واتساب متتابع')+'</div><div class="small">زاروا الفرع بعد الحملة: <b>'+visited+'</b> ('+(c.count?Math.round(visited*100/c.count):0)+'%)</div></div>'}).join(''):'<div class="small muted">ما فيه حملات بعد.</div>'}catch(e){h.innerHTML='<div class="small muted">—</div>'}}
async function runCampaign(mode,L){
  const d=campDraft;if(!L.length)return;const name=d.name||('حملة '+dayKey());
  if(mode==='file'){if(typeof XLSX==='undefined'){toast('مكتبة Excel ما تحمّلت');return}
    const rows=[['phone','name','message','code','org']].concat(L.map(c=>[c.phone,c.name,fillCamp(d.msg,c),c.id,c.orgLabel||'']));
    const ok=await saveFile('حملة-'+name.replace(/[^\p{L}\p{N}\- ]/gu,'')+'-'+dayKey()+'.xlsx',xlsxBlob([['campaign',rows]]));if(!ok)return}
  try{await db.collection('campaigns').add({name,mode,filter:d.filter,message:d.msg,count:L.length,ids:L.map(c=>c.id).slice(0,8000),createdAt:nowISO(),by:me||''})}catch(e){}
  if(mode==='queue'){let i=0;modal('<h2>إرسال متتابع – '+esc(name)+'</h2><div id="wqb"></div>',(m)=>{const draw=()=>{const c=L[i];if(!c){$('#wqb',m).innerHTML='<div class="empty">خلصت القائمة '+ic('check')+'</div>';return}const t=fillCamp(d.msg,c);$('#wqb',m).innerHTML='<div class="small muted">'+(i+1)+' من '+L.length+'</div><div class="gift"><span class="nm">'+esc(c.name)+' <span class="small muted ltr">'+esc(localPhone(c.phone))+'</span></span></div><div class="note" style="white-space:pre-wrap;margin-bottom:10px">'+esc(t)+'</div><div class="row"><a class="btn wa" target="_blank" rel="noopener" id="wqs" href="'+esc(waLink(c.phone,t))+'">إرسال</a><button class="btn sec" id="wqk">تخطّي</button></div>';$('#wqs',m).addEventListener('click',()=>{i++;setTimeout(draw,400)});$('#wqk',m).onclick=()=>{i++;draw()}};draw()})}
  else toast('تم تنزيل ملف الحملة ('+L.length+')');
  const el=$('#abody');if(el)drawCampHist(el);
}

let tFilter='open';
function aTickets(el){
  const list=S.tickets.filter(t=>tFilter==='all'||t.status===tFilter).sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));
  names(S.tickets.map(t=>t.by).concat(S.tickets.map(t=>t.resolvedBy)));
  const pill=t=>t.status==='open'?'<span class="pill p-warn">بانتظار الاعتماد</span>':t.status==='approved'?'<span class="pill p-ok">معتمد</span>':'<span class="pill p-bad">مرفوض</span>';
  el.innerHTML='<div class="card"><div class="row">'+[['open','المفتوحة'],['approved','المعتمدة'],['rejected','المرفوضة'],['all','الكل']].map(x=>'<button class="btn '+(tFilter===x[0]?'':'sec')+' sm" data-tf="'+x[0]+'">'+x[1]+' ('+(x[0]==='all'?S.tickets.length:S.tickets.filter(t=>t.status===x[0]).length)+')</button>').join('')+'</div></div>'+

    '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0"><div><div class="small muted">الرقم القديم</div><b class="ltr">'+esc(t.oldPhone?localPhone(t.oldPhone):(t.oldPhoneRaw||'غير معروف'))+'</b></div><div><div class="small muted">الرقم الجديد</div><b class="ltr" style="color:var(--ok)">'+esc(localPhone(t.newPhone))+'</b></div><div><div class="small muted">السبب</div><b>'+esc(TREASONS[t.reason]||t.reason)+'</b></div><div><div class="small muted">الجهة / الكود</div><b>'+esc(t.orgLabel||'—')+(t.code?' · <span class="code">'+esc(t.code)+'</span>':'')+'</b></div></div>'+
    (t.note?'<div class="small" style="margin-bottom:8px">'+ic('note')+''+esc(t.note)+'</div>':'')+
    '<div class="small muted">أنشأه '+esc(nm(t.by))+' · '+esc(t.branch||'')+' · '+fmtDT(t.createdAt)+(t.resolvedAt?' — '+(t.status==='approved'?'اعتمده':'رفضه')+' '+esc(nm(t.resolvedBy))+' '+fmtDT(t.resolvedAt):'')+(t.rejectReason?' · السبب: '+esc(t.rejectReason):'')+'</div>'+
    (t.status==='open'&&canAny('tickets.approve','tickets.reject')?'<div class="row" style="margin-top:12px">'+(can('tickets.approve')?'<button class="btn ok" data-tapp="'+t.id+'">مراجعة واعتماد</button>':'')+(can('tickets.reject')?'<button class="btn bad" data-trej="'+t.id+'">رفض</button>':'')+'</div>':'')+
    (t.status==='approved'&&c&&canAny('customers.whatsapp','tickets.approve')?'<div class="row" style="margin-top:10px"><a class="btn wa sm" target="_blank" rel="noopener" data-tw="'+c.id+'" href="'+esc(waLink(c.phone,fillMsg(c)))+'">إرسال الكود والرمز للرقم الجديد</a>'+(c.waSentAt?'<span class="small muted">'+ic('check')+'أُرسل</span>':'')+'</div>':'')+'</div>'}).join(''):'<div class="card empty">ما فيه طلبات هنا.</div>');
  $$('[data-tf]',el).forEach(b=>b.onclick=()=>{tFilter=b.dataset.tf;aTickets(el)});

  $$('[data-tapp]',el).forEach(b=>b.onclick=()=>approveTicket(byId(S.tickets,b.dataset.tapp)));

function approveTicket(t){
  const op=t.oldPhone||'';const q=(t.name||'').trim().split(' ')[0];
  let cands=S.customers.filter(c=>(t.customerId&&c.id===t.customerId)||(t.code&&c.id===t.code)||(op&&c.phone===op));
  if(!cands.length&&q)cands=S.customers.filter(c=>(c.name||'').includes(q));
  const taken=S.customers.find(c=>c.phone===t.newPhone);
  modal('<h2>اعتماد تغيير الرقم</h2><p class="muted small">'+esc(t.name)+': <span class="ltr">'+esc(op?localPhone(op):'?')+'</span> ← <b class="ltr">'+esc(localPhone(t.newPhone))+'</b></p>'+
    (taken?'<div class="note" style="background:var(--warnbg);border-color:#f3d9b1;color:var(--warn);margin-bottom:10px">'+ic('alert')+'الرقم الجديد مسجّل باسم <b>'+esc(taken.name)+'</b> ('+esc(taken.id)+'). تأكد قبل الاعتماد.</div>':'')+
    '<h3>اختر بطاقة العميل</h3>'+(cands.length?cands.map((c,i)=>'<label class="gift" style="cursor:pointer"><input type="radio" name="tc" value="'+c.id+'" '+(i===0?'checked':'')+'><span class="nm">'+esc(c.name)+'<div class="small muted"><span class="ltr">'+esc(localPhone(c.phone))+'</span> · '+esc(c.orgLabel||'')+' · <span class="code">'+esc(c.id)+'</span></div></span><span class="pill '+custStatus(c).cls+'">'+custStatus(c).t+'</span></label>').join(''):'<div class="small muted">ما لقيت بطاقة مطابقة تلقائياً.</div>')+
    '<label class="f" style="margin-top:8px"><span>أو اكتب كود العميل يدوياً</span><input type="text" id="tcode" placeholder="مثال: AEKFV3" style="text-transform:uppercase"></label>'+
    '<p class="small muted">عند الاعتماد: يتغير الرقم، يتولّد رمز تسليم جديد (القديم يُلغى)، ويتسجّل التغيير في سجل العميل.</p><button class="btn ok big" id="tOk">اعتماد وتغيير الرقم</button>',(m,close)=>{
    $('#tOk',m).onclick=async()=>{const manual=toLatin($('#tcode',m).value).toUpperCase().replace(/[^A-Z0-9]/g,'');const r=m.querySelector('input[name=tc]:checked');const cid=manual||(r&&r.value);if(!cid){toast('اختر بطاقة العميل');return}
      try{const snap=await db.doc('customers/'+cid).get();if(!snap.exists){toast('الكود غير موجود');return}const cur=snap.data();
        const notes=(cur.notes||[]).concat([{at:nowISO(),by:me||'',text:'تغيير الرقم من '+localPhone(cur.phone)+' إلى '+localPhone(t.newPhone)+' (طلب #'+t.id.slice(0,6)+')',branch:t.branch||''}]).slice(-50);
        await db.doc('customers/'+cid).update({phone:t.newPhone,phoneHistory:(cur.phoneHistory||[]).concat([{phone:cur.phone,until:nowISO()}]),waSentAt:null,notes});try{const r=await OF.sb.rpc('of_new_pin',{p_code:cid});if(r.data)OF.pins[cid]=r.data}catch(x){}
        await db.doc('tickets/'+t.id).update({status:'approved',customerId:cid,oldPhone:t.oldPhone||cur.phone,resolvedAt:nowISO(),resolvedBy:me||''});
        close();toast('تم تغيير الرقم – أرسل الكود والرمز للرقم الجديد')}catch(e){toast('تعذّر الاعتماد: '+(e.code||''))}};
  });
}

  '<label class="chk"><input type="checkbox" name="active" '+(s.active===false?'':'checked')+'> الحساب فعّال</label>'+
  '<button class="btn big ok" type="submit">حفظ</button></form>',(m,close)=>{
    const box=m.querySelector('.modal')||m.firstElementChild;if(box)box.style.maxWidth='900px';
    const f=$('#sef',m);

async function liveScan(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){const fi=$('#qrfile');fi.value='';fi.click();return}
  const ov=document.createElement('div');ov.id='scanOv';ov.style.cssText='position:fixed;inset:0;z-index:9999;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center';
  ov.innerHTML='<video id="scanV" playsinline muted style="width:100%;height:100%;object-fit:cover"></video><div style="position:absolute;width:min(70vw,320px);aspect-ratio:1;border:4px solid #c9a25a;border-radius:22px;box-shadow:0 0 0 9999px rgba(0,0,0,.45)"></div><div id="scanMsg" style="position:absolute;top:22px;left:0;right:0;text-align:center;color:#fff;font-weight:700;font-size:17px">وجّه الكاميرا على QR العميل</div><button id="scanX" class="btn" style="position:absolute;bottom:28px;background:#fff;color:#6e162c;padding:14px 34px;font-weight:700">إغلاق</button>';
  document.body.appendChild(ov);
  let stream=null,done=false,raf=0;
  const close=()=>{done=true;cancelAnimationFrame(raf);if(stream)stream.getTracks().forEach(t=>t.stop());ov.remove();scanStop=null};
  scanStop=close;$('#scanX').onclick=close;
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false})}
  catch(e){close();toast('ما قدرت أفتح الكاميرا – اسمح للمتصفح باستخدامها أو استخدم «أو صوّر صورة»');return}
  const v=$('#scanV');v.srcObject=stream;try{await v.play()}catch(e){}
  let det=null;try{if('BarcodeDetector' in window){const f=await BarcodeDetector.getSupportedFormats();if(f.includes('qr_code'))det=new BarcodeDetector({formats:['qr_code']})}}catch(e){}
  const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});let busy=false,last=0;
  const hit=txt=>{if(done)return;try{navigator.vibrate&&navigator.vibrate(80)}catch(e){}close();staffSearch(txt)};
  const tick=async ts=>{if(done)return;raf=requestAnimationFrame(tick);if(busy||ts-last<120||v.readyState<2)return;busy=true;last=ts;
    try{if(det){const r=await det.detect(v);if(r&&r[0]&&r[0].rawValue){hit(r[0].rawValue.trim());return}}
      else if(typeof jsQR!=='undefined'){const W=v.videoWidth,H=v.videoHeight,S=Math.min(W,H),sc=Math.min(1,640/S);cv.width=Math.round(S*sc);cv.height=cv.width;cx.drawImage(v,(W-S)/2,(H-S)/2,S,S,0,0,cv.width,cv.height);const d=cx.getImageData(0,0,cv.width,cv.height);const r=jsQR(d.data,cv.width,cv.height,{inversionAttempts:'dontInvert'});if(r&&r.data){hit(r.data.trim());return}}
    }catch(e){}busy=false};
  raf=requestAnimationFrame(tick);
}
async function decodeQR(file){
  if(typeof jsQR==='undefined')return null;
  try{const url=URL.createObjectURL(file);const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    for(const max of [1000,1600,600]){const sc=Math.min(1,max/Math.max(img.width,img.height));const w=Math.round(img.width*sc),h=Math.round(img.height*sc);const cv=document.createElement('canvas');cv.width=w;cv.height=h;const cx=cv.getContext('2d');cx.drawImage(img,0,0,w,h);const d=cx.getImageData(0,0,w,h);const r=jsQR(d.data,w,h,{inversionAttempts:'attemptBoth'});if(r&&r.data){URL.revokeObjectURL(url);return r.data.trim()}}
    URL.revokeObjectURL(url);}catch(e){}return null;
}

  if(info.allOut){$('#app').innerHTML='<div class="wrap reg">'+head+'<div class="card empty">نفدت هدايا هذا العرض، شكراً لاهتمامك.</div>'+back+'</div>';return}
  if(org.active===false||!ag||ag.active===false||isExpired(ag)){$('#app').innerHTML='<div class="wrap reg">'+head+'<div class="card empty">التسجيل في هذا العرض مغلق حالياً.</div>'+back+'</div>';return}
  $('#app').innerHTML='<div class="wrap reg">'+head+'<div class="card"><h2>هديتك تنتظرك '+ic('gift')+'</h2><p class="sub" style="margin-bottom:14px">سجّل بياناتك، وتطلع لك هديتك مباشرة وتوصلك على الواتساب مع بطاقة الـ QR.'+(+ag.validDays>0?' صالحة '+ag.validDays+' يوم من تاريخ تسجيلك.':(ag.endsAt?' العرض ساري حتى '+fmtD(ag.endsAt)+'.':''))+'</p>'+
  '<form id="rf"><label class="f"><span>الاسم الكامل</span><input type="text" name="name" required autocomplete="name"></label><label class="f"><span>رقم الجوال (واتساب)</span><input type="tel" name="phone" required placeholder="05xxxxxxxx" inputmode="tel" style="direction:ltr;text-align:right"></label><label class="f"><span>'+ORG_LABEL[org.sector]+'</span><input type="text" name="orgLabel" required value="'+esc(org.name)+'"></label><div class="err" id="rerr"></div>'+(pre.need?'<label class="f"><span>اختر الفرع اللي بتستلم منه</span><select name="brc" required><option value="">— اختر —</option>'+pre.open.map(n=>'<option value="'+esc(n)+'">'+esc(n)+'</option>').join('')+'</select></label>':'')+'<label class="chk"><input type="checkbox" name="ok" required> أوافق على استلام رسالة واتساب من بصمة الاهتمام فيها الكود والعروض.</label><button class="btn big" type="submit" id="rbtn">تسجيل واستلام الكود</button></form></div>'+back+'</div>';
  const f=$('#rf');
  f.onsubmit=async e=>{e.preventDefault();const err=$('#rerr');err.textContent='';
    const name=f.name.value.trim().replace(/\s+/g,' ');const phone=normPhone(f.phone.value);const orgLabel=f.orgLabel.value.trim();
    if(name.split(' ').length<2){err.textContent='اكتب الاسم الأول واسم العائلة على الأقل';return}
    if(!phone){err.textContent='رقم الجوال غير صحيح – اكتبه بصيغة 05xxxxxxxx';return}
    const btn=$('#rbtn');btn.disabled=true;btn.textContent='جاري التسجيل…';
    const reset=m=>{btn.disabled=false;btn.textContent='تسجيل واستلام الكود';err.textContent=m};
    let r;try{r=await OF.sb.rpc('of_public_register',{p_org:org.id,p_name:name,p_phone:phone,p_label:orgLabel,p_branch:f.brc?f.brc.value:null})}catch(x){r={error:x}}
    if(r.error)return reset('تعذّر التسجيل، تأكد من الاتصال وحاول مرة ثانية');
    const d=r.data||{};
    if(!d.ok){const M={bad_phone:'رقم الجوال غير صحيح – اكتبه بصيغة 05xxxxxxxx',bad_name:'اكتب الاسم الأول واسم العائلة على الأقل',closed:'التسجيل في هذا العرض مغلق حالياً.',one_phone:'هذا الرقم مسجّل من قبل في عرض آخر لدى بصمة الاهتمام. كل رقم له عرض واحد فقط.',not_in_roster:'رقمك غير موجود في قائمة '+org.name+' المعتمدة. تواصل مع جهتك لإضافته.',full:'اكتمل العدد المتاح لهذا العرض.',out_of_stock:'نفدت هدايا هذا العرض، شكراً لاهتمامك.',choose_branch:(f.brc&&f.brc.value?'الفرع اللي اخترته اكتمل، اختر فرع ثاني.':'اختر الفرع اللي بتستلم منه.'),no_org:'الرابط غير صحيح.'};return reset(M[d.error]||'تعذّر التسجيل، حاول مرة ثانية')}
    if(!d.existed){try{OF.sb.functions.invoke('hatif-send',{body:{mode:'register',code:d.code}}).catch(()=>{})}catch(x){}}
    regDone({id:d.code,name:d.name,gifts:d.gifts||[],giftsAllowed:d.giftsAllowed,expiresAt:d.expiresAt,branch:d.branch},ag,!!d.existed);
  };
}
function regDone(c,ag,existed){
  S.agreements=[ag].concat(S.agreements.filter(x=>x.id!==ag.id));
  const card=$('.reg .card');
  card.innerHTML='<h2 style="text-align:center">'+(existed?'أنت مسجّل من قبل '+ic('check')+'':'تم تسجيلك بنجاح '+ic('check')+'')+'</h2><p class="sub" style="text-align:center">'+esc(c.name)+' – احفظ الكود أو صوّر الشاشة واعرضها في الفرع.</p><div class="ticket"><div class="qrbox" id="qrR"></div><div class="code">'+esc(c.id)+'</div><div class="small muted">'+(custEnd(c,ag)?'ساري حتى '+fmtD(custEnd(c,ag)):'')+'</div></div>'+
  '<div style="margin-top:14px"><h3 style="margin:0 0 8px">'+ic('gift')+' '+((c.gifts||[]).length>1?((+c.giftsAllowed||+ag.giftsAllowed||1)>=(c.gifts||[]).length?'هداياك':'تختار '+((+c.giftsAllowed||+ag.giftsAllowed||1)===1?'هدية وحدة':(+c.giftsAllowed||+ag.giftsAllowed)+' هدايا')+' من:'):'هديتك')+'</h3>'+(c.gifts||[]).map(g=>'<div class="gift"><span class="nm">'+ic('gift')+''+esc(g.name)+'</span></div>').join('')+'</div>'+
  '<div class="note" style="margin-top:14px;text-align:center">'+ic('key')+'بتوصلك الحين على الواتساب <b>بطاقة هديتك</b> فيها الـ QR و<b>رمز التسليم</b>.<br>عند الاستلام: اعرض البطاقة للموظف، وقل له رمز التسليم.<br>لا تعطي الرمز لأي أحد ثاني.</div>';
  if(c.branch){const b=branchInfo(c.branch);card.insertAdjacentHTML('beforeend','<div class="gift" style="margin-top:10px"><span class="nm">'+ic('pin')+'فرع الاستلام: '+esc(b.name)+(b.address?'<div class="small muted">'+esc(b.address)+'</div>':'')+(b.phone?'<div class="small muted ltr">'+esc(b.phone)+'</div>':'')+'</span>'+(b.map?'<a class="btn sec sm" target="_blank" rel="noopener" href="'+esc(b.map)+'">الموقع</a>':'')+'</div>')}
  if(!(S.settings&&S.settings.servicesOff)){const items=((S.settings&&S.settings.servicesText)||DEFAULT_SVC).split('•').map(x=>x.trim()).filter(Boolean);card.insertAdjacentHTML('beforeend','<div style="margin-top:14px;border-top:1px solid var(--line);padding-top:14px"><h3>خدماتنا</h3><div class="row" style="margin-bottom:10px">'+items.map(x=>'<span class="pill p-mut" style="font-weight:500">'+esc(x)+'</span>').join('')+'</div><a class="btn sec big" target="_blank" rel="noopener" href="'+esc(svcUrl())+'">تعرّف على خدماتنا ومنتجاتنا</a></div>')}
  drawQR($('#qrR'),c.id,200);
}
function authShell(inner){$('#app').innerHTML='<div class="wrap reg"><p style="margin:14px 0 0"><a href="#" class="small">→ الصفحة الرئيسية</a></p><div class="reghead"><div style="margin:10px 0 6px">'+LOGOF(70,true)+'</div><p class="sub">نظام عروض الجهات</p></div><div class="card">'+inner+'</div></div>'}
function renderLogin(mode,email){
  mode=mode||'pw';document.body.classList.remove('lp-body');
  const emIn='<label class="f"><span>البريد الإلكتروني</span><input type="text" name="em" required inputmode="email" autocomplete="email" value="'+esc(email||'')+'" style="direction:ltr;text-align:right"></label>';
  if(mode==='otp'){
    authShell('<h2 style="margin-top:0;text-align:center">دخول منسوبي الشركة</h2><p class="sub" style="text-align:center">اكتب بريدك المسجّل لدى الشركة ويوصلك رمز دخول.</p><form id="lf">'+emIn+'<div class="err" id="lerr"></div><button class="btn big" type="submit">أرسل رمز الدخول</button></form><p style="text-align:center;margin:12px 0 0"><a href="#" id="toPw" class="small">الدخول بكلمة المرور</a></p>');
  }else if(mode==='code'){
    authShell('<h2 style="margin-top:0;text-align:center">'+ic('key')+'أدخل رمز الدخول</h2><p class="sub" style="text-align:center">أرسلنا رمز ورابط دخول إلى <b class="ltr">'+esc(email)+'</b>. اكتب الرمز هنا أو اضغط الرابط في الرسالة.</p><form id="lf"><label class="f"><span>الرمز</span><input type="text" name="code" required inputmode="numeric" autocomplete="one-time-code" maxlength="8" style="direction:ltr;text-align:center;font-size:24px;letter-spacing:8px"></label><div class="err" id="lerr"></div><button class="btn big" type="submit">دخول</button></form><p style="text-align:center;margin:12px 0 0"><a href="#" id="back" class="small">تغيير البريد</a></p>');
  }else{
    authShell('<h2 style="margin-top:0;text-align:center">دخول منسوبي الشركة</h2><p class="sub" style="text-align:center">بإيميلك وكلمة المرور اللي وصلتك من الإدارة.</p><form id="lf">'+emIn+'<label class="f"><span>كلمة المرور</span><input type="password" name="pw" required autocomplete="current-password" style="width:100%;padding:10px 12px;border:1px solid #d7dbe2;border-radius:8px;direction:ltr"></label><div class="err" id="lerr"></div><button class="btn big" type="submit">دخول</button></form><p style="text-align:center;margin:12px 0 0"><a href="#" id="forgot" class="small">نسيت كلمة المرور؟</a></p>');
  }
  const f=$('#lf');const er=$('#lerr');
  const tp=$('#toPw');if(tp)tp.onclick=e=>{e.preventDefault();renderLogin('pw',f.em&&f.em.value)};
  const to=$('#toOtp');if(to)to.onclick=e=>{e.preventDefault();renderLogin('otp',f.em&&f.em.value)};
  const bk=$('#back');if(bk)bk.onclick=e=>{e.preventDefault();renderLogin('otp',email)};
  f.onsubmit=async e=>{e.preventDefault();er.textContent='';er.style.color='';const btn=f.querySelector('button');btn.disabled=true;ssSet('bs_br_ok',null);
    if(mode==='otp'){const em=f.em.value.trim().toLowerCase();if(!/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(em)){er.textContent='البريد غير صحيح';btn.disabled=false;return}
      const {error}=await OF.sb.auth.signInWithOtp({email:em,options:{shouldCreateUser:true,emailRedirectTo:location.origin+'/#login'}});btn.disabled=false;
      if(error){er.textContent=/rate|seconds|limit/i.test(error.message)?'تم إرسال رموز كثيرة – انتظر شوي وحاول مرة ثانية.':'تعذّر الإرسال: '+error.message;return}
      return renderLogin('code',em)}
    if(mode==='code'){const tk=toLatin(f.code.value).replace(/\D/g,'');const {error}=await OF.sb.auth.verifyOtp({email,token:tk,type:'email'});if(error){btn.disabled=false;er.textContent='الرمز غير صحيح أو انتهت صلاحيته.';return}location.hash='login';location.reload();return}
    const em=f.em.value.trim().toLowerCase();const {error}=await OF.sb.auth.signInWithPassword({email:em,password:f.pw.value});if(error){btn.disabled=false;er.textContent=/confirm/i.test(error.message)?'لازم تأكد بريدك أولاً.':'البريد أو كلمة المرور غير صحيحة.';return}location.hash='login';location.reload()};
  const fg=$('#forgot');if(fg)fg.onclick=async e=>{e.preventDefault();const em=f.em.value.trim().toLowerCase();if(!em){er.textContent='اكتب بريدك أولاً';return}await OF.sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+'/'});er.style.color='var(--ok)';er.textContent='أرسلنا رابط تغيير كلمة المرور لبريدك.'};
}
function renderSetPassword(forced){
  const inp=n=>'<label class="f"><span>'+n+'</span><input type="password" name="'+(n.includes('تأكيد')?'pw2':'pw')+'" required minlength="8" autocomplete="new-password" style="width:100%;padding:10px 12px;border:1px solid #d7dbe2;border-radius:8px;direction:ltr"></label>';
  authShell('<h2 style="margin-top:0;text-align:center">'+ic('lock')+(forced?'غيّر كلمة المرور المؤقتة':'تعيين كلمة مرور جديدة')+'</h2>'+(forced?'<p class="sub" style="text-align:center">لازم تختار كلمة مرور خاصة فيك قبل ما تبدأ. 8 خانات أو أكثر.</p>':'')+'<form id="pf">'+inp('كلمة المرور الجديدة')+inp('تأكيد كلمة المرور')+'<div class="err" id="perr"></div><button class="btn big" type="submit">حفظ والمتابعة</button></form>'+(forced?'<p style="text-align:center;margin:12px 0 0"><a href="#" class="small" onclick="sessionStorage.clear();OF.sb.auth.signOut().then(()=>{location.hash=\'\';location.reload()});return false">خروج</a></p>':''));
  $('#pf').onsubmit=async e=>{e.preventDefault();const f=e.target,er=$('#perr');er.textContent='';if(f.pw.value!==f.pw2.value){er.textContent='كلمتا المرور غير متطابقتين.';return}if(/^(\d)\1+$|^(0?123456789?|12345678|87654321|password)$/i.test(f.pw.value)){er.textContent='اختر كلمة مرور أقوى من هذي.';return}
    const btn=f.querySelector('button');btn.disabled=true;const {error}=await OF.sb.auth.updateUser({password:f.pw.value});if(error){btn.disabled=false;er.textContent=/same|different/i.test(error.message)?'لازم تختار كلمة مرور مختلفة عن المؤقتة.':'تعذّر الحفظ: '+error.message;return}
    if(forced){try{await OF.sb.rpc('of_pw_changed')}catch(x){}}OF.recovery=false;location.hash=forced?'login':'';location.reload()};
}
function renderPublicCard(code){location.hash='staff';setTimeout(()=>staffSearch(code,'code'),300)}

boot();
})();
</script>
